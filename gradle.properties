org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.vfs.watch=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
ksp.useKSP2=true
android.nonTransitiveRClass=true
# NekoBox Style: Compress native libs in APK (Small Download, Large Install)
preferCompressedApk=true
# 是否跳过 llvm-strip 压缩 libbox.so（可减少约 10-15% 体积）
skipLibboxStrip=false
# Enable R8 Full Mode for more aggressive shrinking
android.enableR8.fullMode=true
android.uniquePackageNames=false
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false
android.newDsl=true
android.disallowKotlinSourceSets=false
