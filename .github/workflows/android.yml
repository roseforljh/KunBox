name: Android Build

on:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Fetch pinned RayBox source
        uses: actions/checkout@v4
        with:
          repository: roseforljh/RayBox-rx
          ref: ba64d85ef5ff5e9ef740a1558defa465fee7583c
          path: raybox-source
          fetch-depth: 0

      - name: Install verified RayBox release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I tools/sync_raybox.py \
            --source "$GITHUB_WORKSPACE/raybox-source" \
            --release-lock docs/raybox-unification/raybox-android.lock.json \
            --project "$GITHUB_WORKSPACE"

      - name: Normalize and grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          mkdir -p dist

          build_pair() {
            local abi="$1"
            local suffix="${abi//-/_}"
            ./gradlew clean :app:assembleRelease :app:assembleReleaseAndroidTest -PabiOnly="$abi"
            cp app/build/outputs/apk/release/app-*release.apk "dist/kunbox-${suffix}-release.apk"
            cp app/build/outputs/apk/androidTest/release/app-release-androidTest.apk \
              "dist/kunbox-${suffix}-release-androidTest.apk"
          }

          build_pair arm64-v8a
          build_pair armeabi-v7a
          (cd dist && sha256sum *.apk > SHA256SUMS)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-android-apk
          path: dist/*
